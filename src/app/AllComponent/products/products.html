<div class="min-h-screen bg-gray-100 px-4 py-8 sm:px-6 lg:px-8">

  <!-- Heading -->
  <div class="mx-auto mb-8 max-w-7xl">
    <h2 class="text-2xl font-bold text-gray-800 sm:text-3xl">
      Our Products
    </h2>
    <p class="mt-2 text-sm text-gray-500">
      Explore our available products
    </p>
  </div>

  <!-- Product Grid -->
  <div
    class="mx-auto grid max-w-7xl grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
  >

    @for (product of products; track product.id) {

      <div
        class="group overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-gray-200 transition duration-300 hover:-translate-y-1 hover:shadow-xl"
      >

        <!-- Product Image -->
        <div class="relative h-52 overflow-hidden bg-gray-100">

          <img
            [src]="product.image"
            [alt]="product.name"
            class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
          />

          <!-- Product ID -->
          <span
            class="absolute left-3 top-3 rounded-full bg-white/90 px-3 py-1 text-xs font-semibold text-gray-700 shadow"
          >
            #{{ product.id }}
          </span>

        </div>

        <!-- Product Information -->
        <div class="p-5">

          <h3
            class="truncate text-lg font-bold text-gray-800"
            [title]="product.name"
          >
            {{ product.name }}
          </h3>

          <p class="mt-2 line-clamp-2 min-h-10 text-sm leading-5 text-gray-500">
            {{ product.description }}
          </p>

          <!-- Price & Quantity -->
          <div class="mt-5 flex items-center justify-between">

            <div>
              <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                Price
              </p>

              <p class="text-xl font-bold text-gray-900">
                ${{ product.price }}
              </p>
            </div>

            <div class="text-right">
              <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                Stock
              </p>

              <span
                class="inline-flex rounded-full px-3 py-1 text-sm font-semibold"
                [class.bg-green-100]="product.quantity > 0"
                [class.text-green-700]="product.quantity > 0"
                [class.bg-red-100]="product.quantity === 0"
                [class.text-red-700]="product.quantity === 0"
              >
                {{ product.quantity > 0 ? product.quantity + ' available' : 'Out of stock' }}
              </span>
            </div>

          </div>

          <!-- Button -->
          <button
            class="mt-5 w-full rounded-xl bg-gray-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-gray-700 active:scale-[0.98]"
          >
            View Product
          </button>

        </div>

      </div>

    }

  </div>

</div>
