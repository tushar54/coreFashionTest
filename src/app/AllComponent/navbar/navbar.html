
<!-- navbar.component.html -->

<nav class="sticky top-0 z-50 border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-6 px-4 sm:px-6 lg:px-8">

        <!-- Mobile Menu Button -->
        <button class="text-gray-700 lg:hidden" type="button" aria-label="Open menu" (click)="toggleMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        @if(isMobilemenuOpen){
          <div class="items-center gap-7 flex lg:hidden">

            <a routerLink="/" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Home
            </a>

            <a routerLink="/shop" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Shop
            </a>

            <a routerLink="/categories" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Categories
            </a>

            <a routerLink="/new-arrivals" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                New Arrivals
            </a>

            <a routerLink="/offers" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-red-500 transition hover:text-red-600">
                Offers
            </a>

        </div>
        }
       

        <!-- Logo -->
        <a routerLink="/" class="shrink-0">
            <div class="text-2xl font-bold tracking-tight text-gray-900">
                CORE<span class="text-indigo-600">.</span>
            </div>
        </a>


        <!-- Desktop Navigation -->
        <div class="hidden items-center gap-7 lg:flex">

            <a routerLink="/" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Home
            </a>

            <a routerLink="/shop" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Shop
            </a>

            <a routerLink="/categories" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                Categories
            </a>

            <a routerLink="/new-arrivals" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-gray-700 transition hover:text-indigo-600">
                New Arrivals
            </a>

            <a routerLink="/offers" routerLinkActive="text-indigo-600"
                class="text-sm font-medium text-red-500 transition hover:text-red-600">
                Offers
            </a>

        </div>


        <!-- Search -->
        <div class="ml-auto hidden max-w-md flex-1 md:block">
            <div class="relative">

                <input type="text" placeholder="Search products..."
                    class="w-full rounded-full border border-gray-300 bg-gray-50 py-2.5 pl-11 pr-4 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100" />

                <svg xmlns="http://www.w3.org/2000/svg"
                    class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
                </svg>

            </div>
        </div>


        <!-- Right Actions -->
        <div class="flex items-center gap-4">

            <!-- Mobile Search -->
            <button class="text-gray-700 md:hidden" type="button" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
                </svg>
            </button>


            <!-- Wishlist -->
            <a routerLink="/wishlist" class="relative hidden text-gray-700 transition hover:text-indigo-600 sm:block"
                aria-label="Wishlist">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z" />
                </svg>

                <!-- Wishlist Count -->
                <span
                    class="absolute -right-2 -top-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white">
                    2
                </span>
            </a>


            <!-- Cart -->
            <a routerLink="/cart" class="relative text-gray-700 transition hover:text-indigo-600"
                aria-label="Shopping cart">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 7H6" />
                    <circle cx="10" cy="20" r="1" />
                    <circle cx="18" cy="20" r="1" />
                </svg>

                <!-- Cart Count -->
                <span
                    class="absolute -right-2 -top-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-indigo-600 px-1 text-[10px] font-bold text-white">
                    3
                </span>
            </a>


            <!-- Account -->
            <a routerLink="/account"
                class="hidden items-center gap-2 text-gray-700 transition hover:text-indigo-600 sm:flex">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 0 0-16 0" />
                    <circle cx="12" cy="7" r="4" />
                </svg>

                <span class="hidden text-sm font-medium xl:block">
                    Account
                </span>
            </a>

        </div>

    </div>


    <!-- Mobile Search -->
    <div class="border-t border-gray-100 px-4 py-3 md:hidden">
        <div class="relative">

            <input type="text" placeholder="Search products..."
                class="w-full rounded-full border border-gray-300 bg-gray-50 py-2.5 pl-11 pr-4 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100" />

            <svg xmlns="http://www.w3.org/2000/svg"
                class="absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
            </svg>
        </div>
    </div>
</nav>
